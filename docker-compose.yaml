version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-konveksi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: konveksi_db
      POSTGRES_USER: konveksi_user
      POSTGRES_PASSWORD: konveksi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-konveksi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konveksi_user -d konveksi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-konveksi-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://konveksi_user:konveksi_password@postgres:5432/konveksi_db
      - BETTER_AUTH_SECRET=your-super-secret-key-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-konveksi-network

  postgres-dev:
    image: postgres:16-alpine
    container_name: erp-konveksi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - erp-konveksi-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  postgres_dev_data:
    driver: local

networks:
  erp-konveksi-network:
    driver: bridge